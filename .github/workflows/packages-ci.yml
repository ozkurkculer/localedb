name: Packages CI

on:
  push:
    branches: [main]
    paths: ["packages/**", "pnpm-lock.yaml", ".github/workflows/packages-*.yml"]
  pull_request:
    paths: ["packages/**", "pnpm-lock.yaml", ".github/workflows/packages-*.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm packages:typecheck
      - run: pnpm packages:test
